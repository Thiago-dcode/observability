# The single door into the stack. Loki and Grafana publish nothing themselves; every host-reachable
# port is a listener here, one per purpose:
#   :3100  ingest    published on ${INGEST_BIND}  push + /ready only (what Alloy sends)
#   :3000  Grafana   published on ${UI_BIND}:3001 the UI (loopback), reached with `ssh -L` on the VPS
# Grafana queries Loki directly over the compose network, never through here.

# Docker's embedded DNS. With a variable in proxy_pass, nginx resolves the name per request, so it
# starts even when Loki or Grafana is not up yet (a literal hostname would exit "host not found").
resolver 127.0.0.11 valid=10s ipv6=off;

# Grafana Live and Explore live tail use WebSockets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- Ingest: a peer may add log lines, nothing else ----------------------------------------------
server {
    listen 3100;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    location = /loki/api/v1/push {
        limit_except POST { deny all; }
        set $loki http://loki:3100;
        proxy_pass $loki;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /ready {
        limit_except GET { deny all; }
        set $loki http://loki:3100;
        proxy_pass $loki;
        proxy_http_version 1.1;
    }

    # Query, delete, config, metrics, ring...
    location / {
        return 403;
    }
}

# ---- Grafana UI ----------------------------------------------------------------------------------
server {
    listen 3000;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    location / {
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        # $http_host keeps the port the browser used (localhost:3001), which Grafana's WebSocket
        # origin check compares against.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
