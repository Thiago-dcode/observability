# Loki + Grafana behind one nginx gateway. One file for every machine; only .env differs:
#   local PC : INGEST_BIND=127.0.0.1 (the default)
#   VPS      : INGEST_BIND=10.8.0.4  (the WireGuard address; reachable only through the tunnel)
# UI_BIND (Grafana) stays 127.0.0.1 everywhere: a peer on the tunnel must not reach the login page.
#
# Loki and Grafana publish NOTHING. Every port the host can reach is published by `gateway`, which
# routes each listener to one service (see nginx/default.conf).
name: observability

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    restart: unless-stopped
    ports:
      # Never 0.0.0.0. Docker publishes ports ahead of UFW, so the bind address is the control.
      # Ingest (Alloy -> Loki): push + /ready only.
      - "${INGEST_BIND:-127.0.0.1}:3100:3100"
      # Grafana UI. Keep it on loopback: on the VPS you reach it with ssh -L 3001:127.0.0.1:3001 obs-vps
      - "${UI_BIND:-127.0.0.1}:3001:3000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - loki
      - grafana
    security_opt:
      - no-new-privileges:true
    networks:
      - loki

  loki:
    image: grafana/loki:3.7.10
    container_name: loki
    restart: unless-stopped
    # expand-env makes Loki replace ${VAR:-default} in loki/config.yaml from the environment below.
    command: -config.file=/etc/loki/config.yaml -config.expand-env=true
    environment:
      # Forwarded from .env; empty means "use the default written in loki/config.yaml".
      LOKI_RETENTION: ${LOKI_RETENTION:-}
      LOKI_REJECT_OLD_SAMPLES_MAX_AGE: ${LOKI_REJECT_OLD_SAMPLES_MAX_AGE:-}
      LOKI_INGESTION_RATE_MB: ${LOKI_INGESTION_RATE_MB:-}
      LOKI_INGESTION_BURST_MB: ${LOKI_INGESTION_BURST_MB:-}
      LOKI_PER_STREAM_RATE_LIMIT: ${LOKI_PER_STREAM_RATE_LIMIT:-}
    # No `ports:` on purpose: reachable only on the compose network (Grafana, and the gateway).
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - ./data/loki:/loki
    security_opt:
      - no-new-privileges:true
    networks:
      - loki

  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    restart: unless-stopped
    # No `ports:` on purpose: the UI is served through the gateway.
    environment:
      # Only read when Grafana creates its database; an existing grafana.db keeps its login.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true
    networks:
      - loki

networks:
  # Keep the key `loki`: with `name: observability` the network is `observability_loki`, which the
  # a11studio local compose joins as an external network. Renaming it breaks local Alloy.
  loki:
    driver: bridge
